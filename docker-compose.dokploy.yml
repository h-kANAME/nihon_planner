# docker-compose.dokploy.yml
# Dokploy → Compose Path: ./docker-compose.dokploy.yml
# Domain → Service: nihonweb · Port: 8787 · HTTPS/Let's Encrypt

services:
  nihonweb:
    build:
      context: .
      target: prod
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DB_PATH: /app/data/nihon.db
      SERVE_STATIC: "true"
      STATIC_DIR: dist
      COOKIE_SECURE: "true"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    expose:
      - "8787"
    volumes:
      - nihon_data:/app/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  nihon_data:

networks:
  dokploy-network:
    external: true
